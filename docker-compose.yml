x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: 8125
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 8123
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    API_BASE_URL: ${API_BASE_URL:-https://dummyjson.com}
    API_KEY: ${API_KEY:-}
    REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-60}
    API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-15}
    PUSHGATEWAY_URL: http://pushgateway:9091
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-pipeline}
    POSTGRES_USER: ${POSTGRES_USER:-pipeline}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
    DBT_PROJECT_DIR: /opt/dbt
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core==1.8.6 dbt-clickhouse==1.8.1 prometheus-client==0.20.0 requests==2.32.3 psycopg2-binary==2.9.9 PyYAML==6.0.2 tenacity==9.0.0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./dbt:/opt/dbt
    - ./ingestion:/opt/ingestion
  depends_on:
    airflow-metadata:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- OLTP --
  postgres:
    image: postgres:16
    container_name: pipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pipeline-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-pipeline}:${POSTGRES_PASSWORD:-pipeline}@postgres:5432/${POSTGRES_DB:-pipeline}?sslmode=disable"
    depends_on:
      - postgres

  # -------------------------------------------------------- CDC / Kafka --
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pipeline-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pipeline-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
    ports:
      - "9092:9092"

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: pipeline-kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      - kafka

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: pipeline-debezium
    restart: unless-stopped
    depends_on:
      - kafka
      - postgres
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect-cluster
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    ports:
      - "8083:8083"
    volumes:
      - ./debezium:/debezium-setup

  debezium-connector-init:
    image: curlimages/curl:8.9.1
    container_name: pipeline-debezium-init
    depends_on:
      - debezium
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline}
    volumes:
      - ./debezium:/debezium-setup
    entrypoint: ["/bin/sh", "/debezium-setup/register-connector.sh"]
    restart: "no"

  # ---------------------------------------------------------------- OLAP --
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: pipeline-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363" # built-in Prometheus metrics endpoint
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./observability/clickhouse/config.d:/etc/clickhouse-server/config.d
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------- Ingestion --
  ingestion:
    build: ./ingestion
    container_name: pipeline-ingestion
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      API_KEY: ${API_KEY:-}
      API_BASE_URL: ${API_BASE_URL:-https://dummyjson.com}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-60}
      PUSHGATEWAY_URL: http://pushgateway:9091
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["manual"] # normally triggered by Airflow, not compose up

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: pipeline-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"

  # ------------------------------------------------------- Orchestration --
  airflow-metadata:
    image: postgres:16
    container_name: pipeline-airflow-metadata
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: pipeline-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: pipeline-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: pipeline-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  statsd-exporter:
    image: prom/statsd-exporter:v0.27.1
    container_name: pipeline-statsd-exporter
    restart: unless-stopped
    ports:
      - "9102:9102"

  # ------------------------------------------------------- Observability --
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pipeline-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.4
    container_name: pipeline-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  clickhouse_data:
  airflow_metadata:
  airflow_logs:
  prometheus_data:
  grafana_data: